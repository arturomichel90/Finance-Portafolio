name: Refine experience company filter
on:
  push:
    paths:
      - '.github/workflows/refine-experience-company-filter.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine experience filter
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          css='''.experienceToolbar{display:flex;align-items:end;gap:10px;flex-wrap:wrap;margin:0 0 24px;padding:14px 16px;background:rgba(13,27,42,.72);border:1px solid var(--line);border-radius:16px}.experienceToolbar .controlGroup select{min-width:220px}.experienceSummary{display:block}.experienceDetails{display:none;margin-top:18px}.experienceDetails.active{display:block}.summaryLine{color:var(--muted);margin-top:9px}.detailIntro{color:var(--muted);font-size:13px;margin:0 0 18px}.expBullets{margin:12px 0 0;padding-left:20px;color:var(--muted)}.expBullets li{margin:7px 0}.experienceProjectHint{margin-left:auto;color:var(--muted);font-size:11px;align-self:center}@media(max-width:600px){.experienceToolbar{align-items:stretch}.experienceToolbar .controlGroup,.experienceToolbar .controlGroup select{width:100%}.experienceProjectHint{margin-left:0}}'''
          s=s.replace('</style>',css+'</style>',1)
          section='''<section id="experience" class="section"><div class="wrap"><div class="head"><div><div class="eyebrow" data-en="CAREER" data-es="TRAYECTORIA">CAREER</div><h3 data-en="Experience" data-es="Experiencia">Experience</h3></div><p data-en="Executive career overview with deeper company-level detail on demand." data-es="Resumen ejecutivo de trayectoria con detalle ampliado por empresa bajo demanda.">Executive career overview with deeper company-level detail on demand.</p></div><div class="experienceToolbar"><div class="controlGroup"><label data-en="Experience filter" data-es="Filtro de experiencia">Experience filter</label><select id="experienceFilter"><option value="all" data-en="All Experience" data-es="Toda la experiencia">All Experience</option><option value="meli">Mercado Libre</option><option value="fresenius">Fresenius</option><option value="early" data-en="Early Career" data-es="Experiencia Inicial">Early Career</option></select></div><div class="experienceProjectHint" data-en="This filter also updates the related projects and savings shown below." data-es="Este filtro también actualiza los proyectos y ahorros relacionados que se muestran abajo.">This filter also updates the related projects and savings shown below.</div></div><div id="experienceSummary" class="experienceSummary"><div class="timelineItem"><div class="year">2023–2026</div><div><h4>Mercado Libre</h4><div class="role" data-en="Financial Supervisor | Logistics FP&A Lead" data-es="Supervisor Financiero | Líder de FP&A Logístico">Financial Supervisor | Logistics FP&A Lead</div><p class="summaryLine" data-en="Led logistics FP&A across Middle Mile, Cross-Border Trade and commercial carriers, overseeing USD $44.1M monthly spend, 20M–25M shipments and 4 direct reports. Delivered 95% forecast accuracy, <1% accrual-to-billing variance and major transportation savings versus budget." data-es="Lideré FP&A logístico de Middle Mile, Cross-Border Trade y transportistas comerciales, gestionando MXN $750M mensuales, 20M–25M de envíos y 4 reportes directos. Alcancé 95% de precisión de forecast, <1% de variación provisión-facturación y ahorros relevantes de transporte vs. presupuesto.">Led logistics FP&A across Middle Mile, Cross-Border Trade and commercial carriers, overseeing USD $44.1M monthly spend, 20M–25M shipments and 4 direct reports. Delivered 95% forecast accuracy, &lt;1% accrual-to-billing variance and major transportation savings versus budget.</p></div></div><div class="timelineItem"><div class="year">2021–2023</div><div><h4>Mercado Libre</h4><div class="role" data-en="Senior Financial Analyst | Fulfillment Controller" data-es="Analista Financiero Senior | Controller de Fulfillment">Senior Financial Analyst | Fulfillment Controller</div><p class="summaryLine" data-en="Owned Fulfillment budgeting, forecasting and P&L analysis, partnered with cross-functional teams and led packaging optimization that delivered recurring monthly savings across LATAM." data-es="Responsable de presupuesto, forecast y P&L de Fulfillment, business partner de equipos cross-functional y líder de optimización de empaques con ahorros mensuales recurrentes en LATAM.">Owned Fulfillment budgeting, forecasting and P&amp;L analysis, partnered with cross-functional teams and led packaging optimization that delivered recurring monthly savings across LATAM.</p></div></div><div class="timelineItem"><div class="year">2019–2021</div><div><h4>Fresenius Medical Care North America</h4><div class="role" data-en="Financial Supervisor | Assistant Controller | Cost Accounting & FP&A" data-es="Supervisor Financiero | Assistant Controller | Costos & FP&A">Financial Supervisor | Assistant Controller | Cost Accounting & FP&A</div><p class="summaryLine" data-en="Managed manufacturing FP&A, controllership and cost accounting, including budgeting, forecasting, P&L, BOM and variance analysis. Reduced the complete monthly close package from 5 days to 2 days." data-es="Gestioné FP&A de manufactura, controllership y costos, incluyendo presupuesto, forecast, P&L, BOM y análisis de variaciones. Reduje la entrega completa del cierre mensual de 5 a 2 días.">Managed manufacturing FP&A, controllership and cost accounting, including budgeting, forecasting, P&amp;L, BOM and variance analysis. Reduced the complete monthly close package from 5 days to 2 days.</p></div></div><div class="timelineItem"><div class="year">2017–2019</div><div><h4>Fresenius Medical Care North America</h4><div class="role" data-en="Senior Financial Analyst | CAPEX & Fixed Assets" data-es="Analista Financiero Senior | CAPEX & Activos Fijos">Senior Financial Analyst | CAPEX & Fixed Assets</div><p class="summaryLine" data-en="Managed approximately USD $100M in annual CAPEX and increased execution from ~50% to ~90%, while leading CAPEX/depreciation planning and fixed-asset controls." data-es="Gestioné aproximadamente MXN $1,700M de CAPEX anual y aumenté su ejecución de ~50% a ~90%, liderando además planeación de CAPEX/depreciación y controles de activos fijos.">Managed approximately USD $100M in annual CAPEX and increased execution from ~50% to ~90%, while leading CAPEX/depreciation planning and fixed-asset controls.</p></div></div><div class="timelineItem"><div class="year" data-en="2011–2017" data-es="2011–2017">2011–2017</div><div><h4 data-en="Early Career" data-es="Experiencia Inicial">Early Career</h4><div class="role">Kelly Services • Business Owner • Panduit • Deloitte México</div><p class="summaryLine" data-en="Built foundational experience in U.S. billing, reconciliations, customer accounts, entrepreneurship and audit." data-es="Construí experiencia inicial en facturación de EE. UU., conciliaciones, cuentas de clientes, emprendimiento y auditoría.">Built foundational experience in U.S. billing, reconciliations, customer accounts, entrepreneurship and audit.</p></div></div></div><div class="experienceDetails" data-exp-detail="meli"><p class="detailIntro" data-en="Expanded Mercado Libre detail" data-es="Detalle ampliado de Mercado Libre">Expanded Mercado Libre detail</p><div class="timelineItem"><div class="year">2023–2026</div><div><h4>Mercado Libre</h4><div class="role" data-en="Financial Supervisor | Logistics FP&A Lead" data-es="Supervisor Financiero | Líder de FP&A Logístico">Financial Supervisor | Logistics FP&A Lead</div><ul class="expBullets"><li data-en="Promoted based on performance to lead FP&A for Middle Mile, Cross-Border Trade and commercial carriers, overseeing USD $44.1M in monthly spend and 4 direct reports." data-es="Promovido por desempeño para liderar FP&A de Middle Mile, Cross-Border Trade y transportistas comerciales, con MXN $750M de gasto mensual y 4 reportes directos.">Promoted based on performance to lead FP&A for Middle Mile, Cross-Border Trade and commercial carriers, overseeing USD $44.1M in monthly spend and 4 direct reports.</li><li data-en="Led budgeting, forecasting, P&L and variance analysis, achieving 95% forecast accuracy." data-es="Lideré presupuesto, forecast, análisis de P&L y variaciones, alcanzando 95% de precisión del forecast.">Led budgeting, forecasting, P&amp;L and variance analysis, achieving 95% forecast accuracy.</li><li data-en="Modeled Peak Season volume scenarios at +5%, +10%, -5% and -10% versus forecast." data-es="Modelé escenarios de volumen de Peak Season de +5%, +10%, -5% y -10% respecto al forecast.">Modeled Peak Season volume scenarios at +5%, +10%, -5% and -10% versus forecast.</li><li data-en="Automated transportation costing and billing analysis using SQL (BigQuery) across 20M–25M monthly shipments, saving 1 workday per week." data-es="Automaticé costeo de transporte y análisis de facturación con SQL (BigQuery) para 20M–25M de envíos mensuales, ahorrando 1 día de trabajo por semana.">Automated transportation costing and billing analysis using SQL (BigQuery) across 20M–25M monthly shipments, saving 1 workday per week.</li><li data-en="Reduced accrual-to-billing variance to <1% and tracked USD $5.9M–$7.4M in monthly transportation savings versus budget." data-es="Reduje la variación provisión-facturación a <1% y monitoreé MXN $100M–$125M de ahorro mensual frente al presupuesto.">Reduced accrual-to-billing variance to &lt;1% and tracked USD $5.9M–$7.4M in monthly transportation savings versus budget.</li><li data-en="Led 4 analysts; 2 advanced into new roles and the remaining team became autonomous." data-es="Lideré 4 analistas; 2 avanzaron a nuevas posiciones y el resto alcanzó autonomía.">Led 4 analysts; 2 advanced into new roles and the remaining team became autonomous.</li></ul></div></div><div class="timelineItem"><div class="year">2021–2023</div><div><h4>Mercado Libre</h4><div class="role" data-en="Senior Financial Analyst | Fulfillment Controller" data-es="Analista Financiero Senior | Controller de Fulfillment">Senior Financial Analyst | Fulfillment Controller</div><ul class="expBullets"><li data-en="Led budgeting, forecasting, P&L analysis and financial planning for Fulfillment operations." data-es="Responsable de presupuesto, forecast, P&L y planeación financiera de Fulfillment.">Led budgeting, forecasting, P&amp;L analysis and financial planning for Fulfillment operations.</li><li data-en="Developed headcount and labor-cost plans based on volume and operational requirements." data-es="Desarrollé planeación de headcount y costos laborales con base en volumen y necesidades operativas.">Developed headcount and labor-cost plans based on volume and operational requirements.</li><li data-en="Partnered with Operations, Engineering, Quality, Maintenance and HR to manage OPEX, accruals and financial variances." data-es="Finance Business Partner de Operaciones, Ingeniería, Calidad, Mantenimiento y RH en OPEX, provisiones y variaciones.">Partnered with Operations, Engineering, Quality, Maintenance and HR to manage OPEX, accruals and financial variances.</li><li data-en="Led packaging optimization using SQL and Tableau, delivering USD $176K–$294K in recurring monthly savings for 12 months." data-es="Lideré optimización de empaques con SQL y Tableau, generando MXN $3M–$5M de ahorro mensual recurrente durante 12 meses.">Led packaging optimization using SQL and Tableau, delivering USD $176K–$294K in recurring monthly savings for 12 months.</li><li data-en="Scaled packaging analytics across Mexico, Brazil and Argentina and supported CAPEX and warehouse investments." data-es="Escalé analítica de empaques a México, Brasil y Argentina y apoyé CAPEX e inversiones de almacén.">Scaled packaging analytics across Mexico, Brazil and Argentina and supported CAPEX and warehouse investments.</li></ul></div></div></div><div class="experienceDetails" data-exp-detail="fresenius"><p class="detailIntro" data-en="Expanded Fresenius detail" data-es="Detalle ampliado de Fresenius">Expanded Fresenius detail</p><div class="timelineItem"><div class="year">2019–2021</div><div><h4>Fresenius Medical Care North America</h4><div class="role" data-en="Financial Supervisor | Assistant Controller | Cost Accounting & FP&A" data-es="Supervisor Financiero | Assistant Controller | Costos & FP&A">Financial Supervisor | Assistant Controller | Cost Accounting & FP&A</div><ul class="expBullets"><li data-en="Managed budgeting, forecasting, month-end close and full P&L analysis for manufacturing operations." data-es="Responsable de presupuesto, forecast, cierre mensual y P&L de operaciones de manufactura.">Managed budgeting, forecasting, month-end close and full P&amp;L analysis for manufacturing operations.</li><li data-en="Led product costing and BOM analysis, including standard costs, materials, inventory, PPV, usage, FX and manufacturing variances." data-es="Lideré costeo y análisis de BOM, incluyendo costos estándar, materiales, inventarios, PPV, consumo, FX y variaciones de manufactura.">Led product costing and BOM analysis, including standard costs, materials, inventory, PPV, usage, FX and manufacturing variances.</li><li data-en="Reduced delivery of the complete monthly financial close package from 5 days to 2 days using SAP and Advanced Excel." data-es="Reduje de 5 a 2 días la entrega completa del cierre financiero mensual mediante SAP y Excel Avanzado.">Reduced delivery of the complete monthly financial close package from 5 days to 2 days using SAP and Advanced Excel.</li><li data-en="Built ROI, NPV and IRR models for two new production lines and strategic investments." data-es="Lideré modelos financieros de ROI, VAN y TIR para dos nuevas líneas de producción e inversiones.">Built ROI, NPV and IRR models for two new production lines and strategic investments.</li><li data-en="Supported SOX controls, physical inventories and internal and external audits." data-es="Gestioné controles SOX, inventarios físicos y auditorías internas y externas.">Supported SOX controls, physical inventories and internal and external audits.</li></ul></div></div><div class="timelineItem"><div class="year">2017–2019</div><div><h4>Fresenius Medical Care North America</h4><div class="role" data-en="Senior Financial Analyst | CAPEX & Fixed Assets" data-es="Analista Financiero Senior | CAPEX & Activos Fijos">Senior Financial Analyst | CAPEX & Fixed Assets</div><ul class="expBullets"><li data-en="Managed approximately USD $100M in annual CAPEX, increasing execution from ~50% to ~90%." data-es="Gestioné aproximadamente MXN $1,700M de CAPEX anual, aumentando su ejecución de ~50% a ~90%.">Managed approximately USD $100M in annual CAPEX, increasing execution from ~50% to ~90%.</li><li data-en="Led CAPEX and depreciation budgeting, forecasting and variance analysis." data-es="Lideré presupuesto, forecast y variaciones de CAPEX y depreciación.">Led CAPEX and depreciation budgeting, forecasting and variance analysis.</li><li data-en="Managed capitalization, depreciation, transfers, disposals and fixed-asset controls." data-es="Gestioné capitalizaciones, depreciaciones, transferencias, bajas y controles de activos fijos.">Managed capitalization, depreciation, transfers, disposals and fixed-asset controls.</li><li data-en="Automated CAPEX reporting using SAP and Advanced Excel, improving project visibility and control." data-es="Automaticé reportes de CAPEX con SAP y Excel Avanzado, mejorando la visibilidad y control de proyectos.">Automated CAPEX reporting using SAP and Advanced Excel, improving project visibility and control.</li></ul></div></div></div><div class="experienceDetails" data-exp-detail="early"><p class="detailIntro" data-en="Expanded early-career detail" data-es="Detalle ampliado de experiencia inicial">Expanded early-career detail</p><div class="timelineItem"><div class="year">2016–2017</div><div><h4>Kelly Services</h4><div class="role" data-en="Billing Analyst" data-es="Analista de Facturación">Billing Analyst</div><p data-en="Processed and modified U.S. customer invoices, performing validations, adjustments and reconciliations using PeopleSoft and Mainframe." data-es="Procesé y modifiqué facturas de clientes de Estados Unidos, realizando validaciones, ajustes y conciliaciones con PeopleSoft y Mainframe.">Processed and modified U.S. customer invoices, performing validations, adjustments and reconciliations using PeopleSoft and Mainframe.</p></div></div><div class="timelineItem"><div class="year">2015–2016</div><div><h4 data-en="Business Owner" data-es="Propietario de Negocio">Business Owner</h4><p data-en="Founded and managed a water purification and refill business, overseeing operations, customer service and finances." data-es="Fundé y administré un negocio de purificación y rellenado de agua, gestionando operaciones, clientes y finanzas.">Founded and managed a water purification and refill business, overseeing operations, customer service and finances.</p></div></div><div class="timelineItem"><div class="year">2014–2015</div><div><h4>Panduit</h4><div class="role" data-en="Journal Bill Back Analyst" data-es="Analista de Facturación y Cuentas">Journal Bill Back Analyst</div><p data-en="Managed billing adjustments and customer accounts across the U.S. and Canada using Oracle." data-es="Gestioné ajustes de facturación y cuentas de clientes de Estados Unidos y Canadá utilizando Oracle.">Managed billing adjustments and customer accounts across the U.S. and Canada using Oracle.</p></div></div><div class="timelineItem"><div class="year">2011–2012</div><div><h4>Deloitte México</h4><div class="role" data-en="Audit Intern" data-es="Becario de Auditoría">Audit Intern</div><p data-en="Supported automotive dealership audits, physical inventory counts, inventory validation, audit documentation and client follow-up." data-es="Apoyé auditorías de agencias automotrices, conteos físicos, validación de inventarios, documentación y seguimiento con clientes.">Supported automotive dealership audits, physical inventory counts, inventory validation, audit documentation and client follow-up.</p></div></div></div></div></section>'''
          s,n=re.subn(r'<section id="experience" class="section">.*?</section><section id="skills"',section+'<section id="skills"',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('experience section not found')
          js='''<script>(()=>{const sel=document.getElementById('experienceFilter');if(!sel)return;const summary=document.getElementById('experienceSummary');const details=[...document.querySelectorAll('.experienceDetails')];const cases=[...document.querySelectorAll('#impact .case')];function companyForCase(el){const t=(el.textContent||'').toLowerCase();if(t.includes('transport')||t.includes('packag')||t.includes('logistics')||t.includes('forecast'))return'meli';if(t.includes('capex')||t.includes('close')||t.includes('manufactur'))return'fresenius';return'all'}function apply(){const v=sel.value;summary.style.display=v==='all'?'block':'none';details.forEach(d=>d.classList.toggle('active',d.dataset.expDetail===v));cases.forEach(c=>{const company=companyForCase(c);c.classList.toggle('filterHidden',v!=='all'&&company!==v)});if(window.setLanguage){const lang=document.documentElement.lang==='es'?'es':'en';window.setLanguage(lang)}}sel.addEventListener('change',apply);apply()})();</script>'''
          s=s.replace('</body>',js+'</body>',1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine experience filter and link project filtering"
          git push
