name: Final dashboard refinements
on:
  push:
    paths:
      - '.github/workflows/final-dashboard-refinements.yml'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply refinements
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='/* FINAL_REFINEMENTS_20260914 */'
          if marker in s:
              raise SystemExit('Already applied')
          css=r'''
          /* FINAL_REFINEMENTS_20260914 */
          .controlGroup.companyControl{flex:0 1 380px;min-width:300px;max-width:380px}
          .companyControl select{width:100%;font-size:14px;padding:13px 44px 13px 15px}
          .contact{padding:20px 24px;border-radius:16px}.contact h3{font-size:clamp(22px,3vw,30px)}.contactInfo{font-size:12px;gap:5px;margin-top:8px}
          .deepDive{margin-top:26px;padding:24px;background:linear-gradient(180deg,rgba(17,35,57,.96),rgba(12,26,42,.96));border:1px solid var(--line);border-radius:18px}.deepDive h4{font-size:22px;margin-bottom:12px}.deepDive .expBullets{columns:1}.deepDive .expBullets li{margin:9px 0}
          .skillsCurated{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:16px}.skillsCurated .skill{padding:22px}.skillsCurated .skill h4{font-size:18px}.skillsCurated .chips{margin-top:10px}
          .contactModal{position:fixed;inset:0;z-index:1000;background:rgba(3,9,17,.72);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px}.contactModal.open{display:flex}.contactCard{position:relative;width:min(520px,100%);background:linear-gradient(180deg,#112339,#0c1a2a);border:1px solid rgba(134,184,255,.42);border-radius:22px;padding:30px;box-shadow:0 30px 80px rgba(0,0,0,.45)}.contactCard h3{font-size:30px;margin:4px 0 6px}.contactCard p{color:var(--muted);margin:0 0 18px}.contactCard .contactInfo{font-size:14px;gap:10px}.modalClose{position:absolute;right:16px;top:14px;border:0;background:transparent;color:var(--blue);font-size:28px;cursor:pointer}.contactKicker{color:var(--mint);font-size:11px;font-weight:800;letter-spacing:.15em}.modalAuth{margin-top:18px!important;font-size:12px}
          @media(max-width:600px){.controlGroup.companyControl{min-width:100%;max-width:none}.skillsCurated{grid-template-columns:1fr}}
          '''
          s=s.replace('</style>',css+'\n</style>',1)
          modal=r'''
          <div id="contactModal" class="contactModal" aria-hidden="true"><div class="contactCard" role="dialog" aria-modal="true" aria-labelledby="contactModalTitle"><button class="modalClose" id="contactClose" aria-label="Close">×</button><div class="contactKicker" data-en="CONTACT" data-es="CONTACTO">CONTACT</div><h3 id="contactModalTitle">Arturo Michel</h3><p data-en="Finance • FP&A • Business Analytics" data-es="Finanzas • FP&A • Analítica de Negocios">Finance • FP&A • Business Analytics</p><div class="contactInfo"><span>Los Angeles, CA, USA • Guadalajara, Jalisco, México</span><a href="mailto:arturomichel90@gmail.com">arturomichel90@gmail.com</a><a href="tel:+12136562006" data-en="U.S. +1 (213) 656-2006" data-es="EE. UU. +1 (213) 656-2006">U.S. +1 (213) 656-2006</a><a href="tel:+523313072054" data-en="Mexico +52 33 1307 2054" data-es="México +52 33 1307 2054">Mexico +52 33 1307 2054</a><a href="https://linkedin.com/in/arturo-michel-120728142" target="_blank" rel="noopener">LinkedIn</a></div><p class="modalAuth" data-en="U.S. Permanent Resident • No sponsorship required" data-es="Residente Permanente de EE. UU. • No requiere sponsorship">U.S. Permanent Resident • No sponsorship required</p></div></div>
          '''
          s=s.replace('</body>',modal+'\n</body>',1)
          js=r'''
          <script>
          (()=>{
            const $=q=>document.querySelector(q), $$=q=>[...document.querySelectorAll(q)];
            const company=()=>($('#companyFilter')||$('select[id*=company i]'));
            const lang=()=>document.documentElement.lang==='es'?'es':(($('#langEs')||{}).classList?.contains('active')?'es':'en');
            const key=()=>{const v=(company()?.value||'all').toLowerCase(); if(v.includes('meli')||v.includes('mercado'))return 'meli'; if(v.includes('fres'))return 'fresenius'; if(v.includes('early')||v.includes('earl'))return 'early'; return 'all'};
            const exp={
              meli:{en:['Led FP&A for Middle Mile, Cross-Border Trade and commercial carriers across USD $44.1M / MXN $750M in monthly logistics spend and 20M–25M monthly shipments.','Owned budgeting, forecasting, P&L and variance analysis, sustaining 95% forecast accuracy across the monthly logistics cost base.','Built Peak Season scenarios at +5%, +10%, -5% and -10% vs. forecast, assessing cost, capacity and resource requirements.','Automated transportation costing and billing analysis with SQL (BigQuery) across 20M–25M monthly shipments, saving 1 workday per week.','Identified carrier billing discrepancies and supported recovery of credits against subsequent monthly costs; reduced accrual-to-billing variance to <1%.','Delivered transportation savings vs. budget of MXN $100M–$125M / USD $5.9M–$7.4M monthly, approximately MXN $5 / USD $0.29 per shipment.','Evaluated route and carrier scenarios using total spend and cost per shipment, supporting implemented route changes.','Led 4 direct-report analysts; 2 advanced to new roles and the remaining team became autonomous. Interviewed 3 candidates and supported selection, onboarding and training of 2 hires.','Built ROI, NPV and CAPEX business cases and presented results in Finance Manager and senior-leadership Financial Reviews.','As Fulfillment Controller, managed budgeting, forecasting, P&L, headcount and labor-cost planning, OPEX, accruals and key variances.','Built an OPEX and PO control framework using SAP and Google Sheets and standardized budget/forecast controls across Mexico Fulfillment Centers.','Used SQL and Tableau to optimize packaging, delivering MXN $3M–$5M / USD $176K–$294K recurring monthly savings for 12 months; scaled the analytics to Mexico, Brazil and Argentina.'],es:['Lideré FP&A para Middle Mile, Cross-Border Trade y transportistas comerciales sobre USD $44.1M / MXN $750M de gasto logístico mensual y 20M–25M de envíos mensuales.','Gestioné presupuesto, forecast, P&L y análisis de variaciones, manteniendo 95% de precisión de forecast sobre la base mensual de costos logísticos.','Desarrollé escenarios de Peak Season de +5%, +10%, -5% y -10% vs. forecast, evaluando impacto en costos, capacidad y requerimientos de recursos.','Automaticé el costeo de transporte y análisis de facturación con SQL (BigQuery) sobre 20M–25M de envíos mensuales, ahorrando 1 día de trabajo por semana.','Identifiqué discrepancias de facturación de carriers y apoyé la recuperación de créditos contra costos mensuales posteriores; reduje la variación accrual-to-billing a <1%.','Generé ahorros de transporte vs. presupuesto de MXN $100M–$125M / USD $5.9M–$7.4M mensuales, aproximadamente MXN $5 / USD $0.29 por envío.','Evalué escenarios de rutas y carriers usando gasto total y costo por envío, apoyando cambios de rutas implementados.','Lideré 4 analistas directos; 2 avanzaron a nuevos roles y el resto del equipo alcanzó autonomía. Entrevisté 3 candidatos y apoyé selección, onboarding y capacitación de 2 contrataciones.','Construí business cases de ROI, VAN/NPV y CAPEX y presenté resultados al Finance Manager y en Financial Reviews con liderazgo senior.','Como Fulfillment Controller gestioné presupuesto, forecast, P&L, headcount y costo laboral, OPEX, accruals y variaciones clave.','Construí un framework de control de OPEX y POs con SAP y Google Sheets y estandaricé controles de presupuesto/forecast en Fulfillment Centers de México.','Usé SQL y Tableau para optimizar packaging, generando MXN $3M–$5M / USD $176K–$294K de ahorro mensual recurrente durante 12 meses; escalé el análisis a México, Brasil y Argentina.']},
              fresenius:{en:['Promoted to Financial Supervisor / Assistant Controller with expanded responsibility across cost accounting, FP&A and controllership.','Owned budgeting, forecasting, month-end close and full P&L analysis for manufacturing operations.','Managed product costing and BOMs, standard costs, production volumes, materials and inventory; analyzed PPV, material usage, FX and manufacturing variances.','Reduced the complete monthly financial close package from 5 days to 2 days using SAP and Advanced Excel.','Built ROI, NPV and IRR models for two new production lines and other strategic investments.','Managed OPEX, fixed assets, accounts payable and P&L review; supported SOX controls, physical inventories and internal/external audits.','Previously managed approximately USD $100M / MXN $1,700M annual CAPEX and increased CAPEX execution from ~50% to ~90%.','Owned CAPEX and depreciation budgeting, forecasting and variance analysis plus capitalization, transfers, disposals and fixed-asset controls.','Automated CAPEX reporting with SAP and Advanced Excel and partnered with Engineering and Quality on investment execution.'],es:['Fui promovido a Financial Supervisor / Assistant Controller con mayor responsabilidad en cost accounting, FP&A y contraloría.','Gestioné presupuesto, forecast, cierre mensual y análisis completo de P&L para operaciones de manufactura.','Gestioné costeo de producto y BOMs, costos estándar, volúmenes de producción, materiales e inventarios; analicé PPV, uso de materiales, FX y variaciones de manufactura.','Reduje el paquete completo de cierre financiero mensual de 5 días a 2 días usando SAP y Excel Avanzado.','Construí modelos de ROI, VAN/NPV y TIR/IRR para dos nuevas líneas de producción y otras inversiones estratégicas.','Gestioné OPEX, activos fijos, cuentas por pagar y revisión de P&L; apoyé controles SOX, inventarios físicos y auditorías internas/externas.','Previamente gestioné aproximadamente USD $100M / MXN $1,700M de CAPEX anual e incrementé la ejecución de CAPEX de ~50% a ~90%.','Gestioné presupuesto, forecast y variaciones de CAPEX y depreciación, además de capitalizaciones, transferencias, bajas y controles de activos fijos.','Automaticé reportes de CAPEX con SAP y Excel Avanzado y trabajé como Finance Business Partner con Ingeniería y Calidad.']},
              early:{en:['Kelly Services — Billing Analyst: managed U.S. customer invoices, validations, adjustments and reconciliations using PeopleSoft and Mainframe.','Business Owner: founded and managed a water purification/refill business, covering operations, customer service and finances.','Panduit — Journal Bill Back Analyst: handled U.S. and Canada billing adjustments and accounts using Oracle.','Deloitte México — Audit Intern: supported automotive dealership audits, physical inventory counts, inventory validation, audit documentation and client follow-up.'],es:['Kelly Services — Billing Analyst: gestioné facturas de clientes de EE. UU., validaciones, ajustes y conciliaciones usando PeopleSoft y Mainframe.','Business Owner: fundé y administré un negocio de purificación y rellenado de agua, cubriendo operaciones, servicio al cliente y finanzas.','Panduit — Journal Bill Back Analyst: gestioné ajustes de facturación y cuentas de EE. UU. y Canadá usando Oracle.','Deloitte México — Audit Intern: apoyé auditorías de agencias automotrices, conteos físicos, validación de inventarios, documentación de auditoría y seguimiento con clientes.']}
            };
            const skills={all:{en:{'FP&A':['P&L Management','Budgeting & Forecasting','Variance Analysis','Scenario Analysis','Cost Optimization','Financial Modeling'],'Leadership & Business Partnering':['Team Leadership','Talent Development','Finance Business Partnering','Executive Reporting','Financial Performance Management'],'Controllership & Investment':['Month-End Close','Cost Accounting','CAPEX','ROI / NPV / IRR','SOX & Internal Controls'],'Data & Analytics':['Business Analytics','Process Automation','Dashboarding','Cost & Operational Analytics','Data-driven Decision Support']},es:{'FP&A':['Gestión de P&L','Presupuesto y Forecast','Análisis de Variaciones','Análisis de Escenarios','Optimización de Costos','Modelación Financiera'],'Liderazgo & Business Partnering':['Liderazgo de Equipo','Desarrollo de Talento','Finance Business Partnering','Reporting Ejecutivo','Gestión del Desempeño Financiero'],'Contraloría & Inversión':['Cierre Mensual','Cost Accounting','CAPEX','ROI / VAN / TIR','SOX y Controles Internos'],'Datos & Analítica':['Analítica de Negocios','Automatización de Procesos','Dashboards','Analítica de Costos y Operaciones','Decisiones Basadas en Datos']}},meli:{en:{'FP&A':['P&L Management','Budgeting & Forecasting','Variance Analysis','Headcount Planning','Volume Forecasting','Peak Season Scenario Analysis','Sensitivity Analysis','Cost Optimization','Cost per Shipment','Accruals'],'Leadership & Business Partnering':['Team Leadership','Talent Development','Delegation','Hiring & Onboarding','Finance Business Partnering','Executive Reporting','Financial Reviews','Cross-functional Partnership'],'Investment & Controls':['Business Cases','ROI','NPV','CAPEX','PO Control','Billing Reconciliation','Accrual-to-Billing Control'],'Data & Analytics':['Business Analytics','Process Automation','Transportation Cost Analytics','Packaging Analytics','Dashboarding','Route & Carrier Scenario Analysis']},es:{'FP&A':['Gestión de P&L','Presupuesto y Forecast','Análisis de Variaciones','Planeación de Headcount','Forecast de Volumen','Escenarios de Peak Season','Análisis de Sensibilidad','Optimización de Costos','Costo por Envío','Accruals'],'Liderazgo & Business Partnering':['Liderazgo de Equipo','Desarrollo de Talento','Delegación','Contratación y Onboarding','Finance Business Partnering','Reporting Ejecutivo','Financial Reviews','Colaboración Cross-functional'],'Inversión & Controles':['Business Cases','ROI','VAN/NPV','CAPEX','Control de POs','Conciliación de Facturación','Control Accrual-to-Billing'],'Datos & Analítica':['Analítica de Negocios','Automatización de Procesos','Analítica de Costos de Transporte','Analítica de Packaging','Dashboards','Análisis de Rutas y Carriers']}},fresenius:{en:{'FP&A':['P&L Analysis','Budgeting & Forecasting','Variance Analysis','Manufacturing Finance','OPEX Planning','Depreciation Forecasting'],'Cost Accounting & Controllership':['Month-End Close','Cost Accounting','Standard Costing','BOM','PPV','Material Usage Variance','Inventory Controls','Fixed Assets','Accounts Payable','SOX','Internal Controls','Audit Support'],'Investment':['CAPEX Planning','CAPEX Execution','ROI','NPV','IRR','Investment Analysis'],'Business Partnering':['Engineering Partnership','Quality Partnership','Financial Reporting','Process Improvement']},es:{'FP&A':['Análisis de P&L','Presupuesto y Forecast','Análisis de Variaciones','Finanzas de Manufactura','Planeación de OPEX','Forecast de Depreciación'],'Cost Accounting & Contraloría':['Cierre Mensual','Cost Accounting','Costeo Estándar','BOM','PPV','Variación de Uso de Materiales','Controles de Inventario','Activos Fijos','Cuentas por Pagar','SOX','Controles Internos','Soporte de Auditoría'],'Inversión':['Planeación de CAPEX','Ejecución de CAPEX','ROI','VAN/NPV','TIR/IRR','Análisis de Inversiones'],'Business Partnering':['Colaboración con Ingeniería','Colaboración con Calidad','Reporting Financiero','Mejora de Procesos']}},early:{en:{'Billing & Reconciliation':['Billing','Invoice Validation','Adjustments','Reconciliations','Customer Accounts'],'Operations & Ownership':['Business Operations','Customer Service','Financial Management','Entrepreneurship'],'Audit & Controls':['Audit Support','Physical Inventory Counts','Inventory Validation','Audit Documentation','Client Follow-up']},es:{'Facturación & Conciliación':['Facturación','Validación de Facturas','Ajustes','Conciliaciones','Cuentas de Clientes'],'Operaciones & Emprendimiento':['Operaciones de Negocio','Servicio al Cliente','Gestión Financiera','Emprendimiento'],'Auditoría & Controles':['Soporte de Auditoría','Conteos Físicos de Inventario','Validación de Inventarios','Documentación de Auditoría','Seguimiento con Clientes']}}};
            function renderDeep(){let box=$('#filterDeepDive'); if(!box){box=document.createElement('div');box.id='filterDeepDive';box.className='deepDive';const sec=$('#experience .wrap');if(sec)sec.appendChild(box)} const k=key(),l=lang(); if(!box)return; if(k==='all'){box.style.display='none';return} box.style.display='block';box.innerHTML=`<h4>${l==='es'?'Detalle completo de la experiencia':'Full experience detail'}</h4><ul class="expBullets">${exp[k][l].map(x=>`<li>${x}</li>`).join('')}</ul>`}
            function renderSkills(){const host=$('#skills .wrap');if(!host)return; let box=$('#curatedSkills');if(!box){box=document.createElement('div');box.id='curatedSkills';box.className='skillsCurated';host.appendChild(box)} const k=key(),l=lang(),d=skills[k][l]; box.innerHTML=Object.entries(d).map(([h,a])=>`<article class="skill"><h4>${h}</h4><div class="chips">${a.map(x=>`<span>${x}</span>`).join('')}</div></article>`).join(''); const original=$$('#skills .skills');original.forEach(x=>x.style.display='none')}
            function contactSetup(){const modal=$('#contactModal'),close=$('#contactClose');$$('a').filter(a=>(a.getAttribute('href')||'')==='#contact' && ((a.textContent||'').trim().toLowerCase()==='contact'||(a.textContent||'').trim().toLowerCase()==='contacto')).forEach(a=>a.addEventListener('click',e=>{e.preventDefault();modal?.classList.add('open');modal?.setAttribute('aria-hidden','false')})); close?.addEventListener('click',()=>{modal.classList.remove('open');modal.setAttribute('aria-hidden','true')});modal?.addEventListener('click',e=>{if(e.target===modal){modal.classList.remove('open');modal.setAttribute('aria-hidden','true')}});document.addEventListener('keydown',e=>{if(e.key==='Escape')modal?.classList.remove('open')})}
            function charts(){const cvs=$$('.charts canvas');if(cvs.length<2||typeof Chart==='undefined')return; const c1=Chart.getChart(cvs[0]),c2=Chart.getChart(cvs[1]);const usd=($('#currencyFilter')?.value||'USD')==='USD'; const months=lang()==='es'?['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic']:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; if(c1){c1.config.type='bar';c1.data.labels=months;c1.data.datasets[0].data=usd?[6.35,6.59,6.18,6.94,6.47,7.12,6.82,7.24,7.00,7.35,6.88,7.18]:[108,112,105,118,110,121,116,123,119,125,117,122];c1.update()} if(c2){c2.config.type='line';c2.data.labels=months;c2.data.datasets[0].data=usd?[188,206,194,224,235,218,247,259,241,271,282,265]:[3.2,3.5,3.3,3.8,4.0,3.7,4.2,4.4,4.1,4.6,4.8,4.5];c2.update()}}
            function refresh(){setTimeout(()=>{renderDeep();renderSkills();charts()},30)}
            window.addEventListener('load',()=>{contactSetup();refresh();company()?.addEventListener('change',refresh);$('#currencyFilter')?.addEventListener('change',()=>setTimeout(charts,30));$('#langEn')?.addEventListener('click',refresh);$('#langEs')?.addEventListener('click',refresh)});
          })();
          </script>
          '''
          s=s.replace('</body>',js+'\n</body>',1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine bilingual dashboard UX and detail" || exit 0
          git push
