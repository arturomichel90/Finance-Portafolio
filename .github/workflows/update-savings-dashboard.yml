name: Update savings dashboard

on:
  push:
    paths:
      - '.github/workflows/update-savings-dashboard.yml'

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update savings charts
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_transport = '''<article class="card"><div class="chartHead"><div><div class="kicker" data-en="COST OPTIMIZATION" data-es="OPTIMIZACIÓN DE COSTOS">COST OPTIMIZATION</div><h4 data-en="Transportation savings vs. budget" data-es="Ahorro en transporte vs. presupuesto">Transportation savings vs. budget</h4><div class="projectTag"><b>Mercado Libre</b><span>2023–2026</span></div></div><div class="stat">$5.9M–$7.4M<small data-en="recurring monthly range" data-es="rango mensual recurrente">recurring monthly range</small></div></div><div class="canvas"><canvas id="transport"></canvas></div><div class="driverGrid"><div class="driver"><span data-en="Savings driver" data-es="Driver de ahorro">Savings driver</span><strong>~$0.29 / shipment</strong></div><div class="driver"><span data-en="Monthly volume" data-es="Volumen mensual">Monthly volume</span><strong>20M–25M</strong></div><div class="driver"><span data-en="Evidence" data-es="Evidencia">Evidence</span><strong data-en="Documented range" data-es="Rango documentado">Documented range</strong></div></div><p class="note" data-en="Minimum and maximum documented recurring monthly savings. This is not a monthly historical time series." data-es="Ahorro mensual recurrente mínimo y máximo documentado. No representa una serie histórica mensual.">Minimum and maximum documented recurring monthly savings. This is not a monthly historical time series.</p></article>'''

          new_transport = '''<article class="card"><div class="chartHead"><div><div class="kicker" data-en="COST OPTIMIZATION" data-es="OPTIMIZACIÓN DE COSTOS">COST OPTIMIZATION</div><h4 data-en="Transportation savings vs. budget" data-es="Ahorro en transporte vs. presupuesto">Transportation savings vs. budget</h4><div class="projectTag"><b>Mercado Libre</b><span>2024</span></div></div><div class="stat">MXN $100M–$125M<small data-en="annual savings range" data-es="rango de ahorro anual">annual savings range</small></div></div><div class="canvas"><canvas id="transport"></canvas></div><div class="driverGrid"><div class="driver"><span data-en="USD equivalent" data-es="Equivalente USD">USD equivalent</span><strong>≈$5.5M–$6.8M</strong></div><div class="driver"><span data-en="Average monthly" data-es="Promedio mensual">Average monthly</span><strong>≈MXN $9.4M</strong></div><div class="driver"><span data-en="Monthly volume" data-es="Volumen mensual">Monthly volume</span><strong>20M–25M</strong></div></div><p class="note" data-en="Monthly bars are a smooth illustrative distribution around the midpoint of the documented annual range. USD equivalent uses the 2024 average FX rate (~18.325 MXN/USD)." data-es="Las barras mensuales son una distribución ilustrativa y suave alrededor del punto medio del rango anual documentado. El equivalente en USD usa el tipo de cambio promedio de 2024 (~18.325 MXN/USD).">Monthly bars are a smooth illustrative distribution around the midpoint of the documented annual range. USD equivalent uses the 2024 average FX rate (~18.325 MXN/USD).</p></article>'''

          old_packaging = '''<article class="card"><div class="chartHead"><div><div class="kicker" data-en="LATAM STANDARDIZATION" data-es="ESTANDARIZACIÓN LATAM">LATAM STANDARDIZATION</div><h4 data-en="Recurring packaging savings" data-es="Ahorro recurrente en empaque">Recurring packaging savings</h4><div class="projectTag"><b>Mercado Libre</b><span>2021–2023</span></div></div><div class="stat">$176K–$294K<small data-en="per month • 12 months" data-es="por mes • 12 meses">per month • 12 months</small></div></div><div class="canvas smallCanvas"><canvas id="packaging"></canvas></div><div class="driverGrid"><div class="driver"><span data-en="Monthly cost base" data-es="Base mensual de costo">Monthly cost base</span><strong>~$29.4M</strong></div><div class="driver"><span data-en="Savings rate" data-es="Tasa de ahorro">Savings rate</span><strong>0.6%–1.0%</strong></div><div class="driver"><span data-en="Duration" data-es="Duración">Duration</span><strong>12 months</strong></div></div><p class="note" data-en="The shaded band repeats the documented recurring monthly savings range across the 12-month initiative; it does not represent invented month-by-month actuals." data-es="La banda sombreada repite el rango documentado de ahorro mensual recurrente durante los 12 meses de la iniciativa; no representa valores mensuales inventados.">The shaded band repeats the documented recurring monthly savings range across the 12-month initiative; it does not represent invented month-by-month actuals.</p></article>'''

          new_packaging = '''<article class="card"><div class="chartHead"><div><div class="kicker" data-en="LATAM STANDARDIZATION" data-es="ESTANDARIZACIÓN LATAM">LATAM STANDARDIZATION</div><h4 data-en="Recurring packaging savings" data-es="Ahorro recurrente en empaque">Recurring packaging savings</h4><div class="projectTag"><b>Mercado Libre</b><span>2022</span></div></div><div class="stat">MXN $4.5M–$5.5M<small data-en="annual savings range" data-es="rango de ahorro anual">annual savings range</small></div></div><div class="canvas smallCanvas"><canvas id="packaging"></canvas></div><div class="driverGrid"><div class="driver"><span data-en="USD equivalent" data-es="Equivalente USD">USD equivalent</span><strong>≈$224K–$274K</strong></div><div class="driver"><span data-en="Average monthly" data-es="Promedio mensual">Average monthly</span><strong>≈MXN $417K</strong></div><div class="driver"><span data-en="Monthly cost base" data-es="Base mensual de costo">Monthly cost base</span><strong>~$29.4M</strong></div></div><p class="note" data-en="Monthly points are a smooth illustrative distribution around the midpoint of the documented annual range. USD equivalent uses the 2022 average FX rate (~20.109 MXN/USD)." data-es="Los puntos mensuales son una distribución ilustrativa y suave alrededor del punto medio del rango anual documentado. El equivalente en USD usa el tipo de cambio promedio de 2022 (~20.109 MXN/USD).">Monthly points are a smooth illustrative distribution around the midpoint of the documented annual range. USD equivalent uses the 2022 average FX rate (~20.109 MXN/USD).</p></article>'''

          old_transport_case = '''<div class="kicker" data-en="TRANSPORTATION FP&A • 2023–2026" data-es="FP&A DE TRANSPORTE • 2023–2026">TRANSPORTATION FP&A • 2023–2026</div><h4 data-en="Transportation cost optimization" data-es="Optimización de costos de transporte">Transportation cost optimization</h4><p data-en="Built route, carrier and cost scenarios to improve budget performance across a large-scale logistics network." data-es="Desarrollé escenarios de rutas, carriers y costos para mejorar el desempeño presupuestal de una red logística de gran escala.">Built route, carrier and cost scenarios to improve budget performance across a large-scale logistics network.</p><div class="caseMetric">$5.9M–$7.4M <span data-en="monthly" data-es="mensuales">monthly</span></div>'''
          new_transport_case = '''<div class="kicker" data-en="TRANSPORTATION COST OPTIMIZATION • 2024" data-es="OPTIMIZACIÓN DE COSTOS DE TRANSPORTE • 2024">TRANSPORTATION COST OPTIMIZATION • 2024</div><h4 data-en="Transportation cost optimization" data-es="Optimización de costos de transporte">Transportation cost optimization</h4><p data-en="Built route, carrier and cost scenarios to improve budget performance across a large-scale logistics network." data-es="Desarrollé escenarios de rutas, carriers y costos para mejorar el desempeño presupuestal de una red logística de gran escala.">Built route, carrier and cost scenarios to improve budget performance across a large-scale logistics network.</p><div class="caseMetric">MXN $100M–$125M <span data-en="annual savings" data-es="ahorro anual">annual savings</span></div>'''

          old_packaging_case = '''<div class="kicker" data-en="PACKAGING • 2021–2023" data-es="EMPAQUE • 2021–2023">PACKAGING • 2021–2023</div><h4 data-en="LATAM packaging optimization" data-es="Optimización de empaque LATAM">LATAM packaging optimization</h4><p data-en="Developed cost analytics and standardized insights across Mexico, Brazil and Argentina." data-es="Desarrollé analítica de costos y estandaricé insights entre México, Brasil y Argentina.">Developed cost analytics and standardized insights across Mexico, Brazil and Argentina.</p><div class="caseMetric">$176K–$294K <span data-en="monthly" data-es="mensuales">monthly</span></div>'''
          new_packaging_case = '''<div class="kicker" data-en="PACKAGING • 2022" data-es="EMPAQUE • 2022">PACKAGING • 2022</div><h4 data-en="LATAM packaging optimization" data-es="Optimización de empaque LATAM">LATAM packaging optimization</h4><p data-en="Developed cost analytics and standardized insights across Mexico, Brazil and Argentina." data-es="Desarrollé analítica de costos y estandaricé insights entre México, Brasil y Argentina.">Developed cost analytics and standardized insights across Mexico, Brazil and Argentina.</p><div class="caseMetric">MXN $4.5M–$5.5M <span data-en="annual savings" data-es="ahorro anual">annual savings</span></div>'''

          old_charts = """const common={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:M},ticks:{color:G}},y:{grid:{display:false},ticks:{color:G}}}};new Chart(document.getElementById('transport'),{type:'scatter',data:{datasets:[{data:[{x:5.9,y:1},{x:7.4,y:1}],showLine:true,borderColor:T,borderWidth:4,pointRadius:8,pointHoverRadius:9,pointBackgroundColor:[T,B],pointBorderColor:'#07111f',pointBorderWidth:3,tension:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>(c.dataIndex===0?'Lower documented bound: $':'Upper documented bound: $')+c.raw.x.toFixed(1)+'M / month'}}},scales:{x:{min:5.4,max:7.9,grid:{color:M},ticks:{color:G,callback:v=>'$'+v.toFixed(1)+'M'},title:{display:true,text:'Documented recurring monthly savings range',color:G}},y:{min:.75,max:1.25,display:false}}}});const months=Array.from({length:12},(_,i)=>'M'+(i+1));new Chart(document.getElementById('packaging'),{type:'line',data:{labels:months,datasets:[{label:'Upper bound',data:Array(12).fill(294),borderColor:B,backgroundColor:'rgba(134,184,255,.18)',borderWidth:2,pointRadius:0,fill:'+1',tension:0},{label:'Lower bound',data:Array(12).fill(176),borderColor:T,backgroundColor:'rgba(94,230,181,.05)',borderWidth:2,pointRadius:0,tension:0}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{callbacks:{title:i=>'Initiative '+i[0].label,label:c=>(c.datasetIndex===0?'Upper documented range: $':'Lower documented range: $')+c.raw+'K / month',footer:()=> 'Range repeated for visualization; not monthly actuals.'}}},scales:{x:{grid:{display:false},ticks:{color:G}},y:{min:140,max:320,grid:{color:M},ticks:{color:G,callback:v=>'$'+v+'K'}}}}});"""

          new_charts = """const monthsEn=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];const monthsEs=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];const transportMonthly=[8.9,9.2,9.5,9.1,9.7,9.4,9.8,9.3,9.6,9.0,9.7,9.3];const packagingMonthly=[390,405,420,410,435,425,440,415,430,400,445,385];const transportFx=18.325,packagingFx=20.109;const transportChart=new Chart(document.getElementById('transport'),{type:'bar',data:{labels:monthsEn,datasets:[{data:transportMonthly,backgroundColor:'rgba(94,230,181,.72)',borderColor:T,borderWidth:1,borderRadius:7,maxBarThickness:34}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{title:i=>i[0].label+' 2024',label:c=>{const mxn=c.raw,usd=mxn/transportFx;return (lang==='es'?'Ahorro mensual: MXN $':'Monthly savings: MXN $')+mxn.toFixed(1)+'M  |  ≈USD $'+usd.toFixed(2)+'M';}}}},scales:{x:{grid:{display:false},ticks:{color:G}},y:{min:8,max:10.2,grid:{color:M},ticks:{color:G,callback:v=>'MXN $'+v.toFixed(1)+'M'}}}}});const packagingChart=new Chart(document.getElementById('packaging'),{type:'line',data:{labels:monthsEn,datasets:[{data:packagingMonthly,borderColor:B,backgroundColor:'rgba(134,184,255,.10)',borderWidth:3,pointRadius:4,pointHoverRadius:6,pointBackgroundColor:T,pointBorderColor:'#07111f',pointBorderWidth:2,tension:.35,fill:false}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{callbacks:{title:i=>i[0].label+' 2022',label:c=>{const mxn=c.raw,usd=mxn/packagingFx;return (lang==='es'?'Ahorro mensual: MXN $':'Monthly savings: MXN $')+mxn.toFixed(0)+'K  |  ≈USD $'+usd.toFixed(1)+'K';}}}},scales:{x:{grid:{display:false},ticks:{color:G}},y:{min:360,max:460,grid:{color:M},ticks:{color:G,callback:v=>'MXN $'+v+'K'}}}}});"""

          old_lang = """function applyLanguage(next){lang=next;document.documentElement.lang=lang;document.querySelectorAll('[data-en][data-es]').forEach(el=>{el.textContent=el.dataset[lang]});const phoneLabel=document.querySelector('#phoneLine span');"""
          new_lang = """function applyLanguage(next){lang=next;document.documentElement.lang=lang;document.querySelectorAll('[data-en][data-es]').forEach(el=>{el.textContent=el.dataset[lang]});const labels=lang==='es'?monthsEs:monthsEn;transportChart.data.labels=labels;packagingChart.data.labels=labels;transportChart.update();packagingChart.update();const phoneLabel=document.querySelector('#phoneLine span');"""

          replacements = [(old_transport,new_transport),(old_packaging,new_packaging),(old_transport_case,new_transport_case),(old_packaging_case,new_packaging_case),(old_charts,new_charts),(old_lang,new_lang)]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit('Expected source block not found')
              s = s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')

      - name: Commit dashboard update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update savings charts with monthly ranges" || exit 0
          git push
