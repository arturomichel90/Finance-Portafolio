name: Update interactive experience
on:
  push:
    paths:
      - '.github/workflows/update-experience-filter.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update experience section
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          css='''.experienceFilters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 24px}.expFilter{border:1px solid var(--line);background:rgba(255,255,255,.025);color:var(--muted);padding:10px 15px;border-radius:999px;font:700 12px Inter;cursor:pointer;transition:.2s}.expFilter:hover{color:var(--text);border-color:rgba(94,230,181,.45)}.expFilter.active{background:var(--mint);color:#07111f;border-color:var(--mint)}.expGroup{display:none}.expGroup.active{display:block}.expBullets{margin:12px 0 0;padding-left:20px;color:var(--muted)}.expBullets li{margin:7px 0}.expCompanySummary{color:var(--muted);font-size:13px;margin:-10px 0 22px}.earlyGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.earlyRole{padding:18px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.02)}.earlyRole h4{font-size:17px}.earlyRole .year{font-size:12px;margin:5px 0}.earlyRole p{font-size:13px;color:var(--muted);margin-bottom:0}@media(max-width:700px){.earlyGrid{grid-template-columns:1fr}}'''
          s=s.replace('</style>',css+'</style>',1)
          section='''<section id="experience" class="section"><div class="wrap"><div class="head"><div><div class="eyebrow" data-en="CAREER" data-es="TRAYECTORIA">CAREER</div><h3 data-en="Experience" data-es="Experiencia">Experience</h3></div><p data-en="Explore my experience by company and role." data-es="Explora mi experiencia por empresa y puesto.">Explore my experience by company and role.</p></div><div class="experienceFilters"><button class="expFilter active" data-exp="meli">Mercado Libre</button><button class="expFilter" data-exp="fresenius">Fresenius</button><button class="expFilter" data-exp="early" data-en="Early Career" data-es="Experiencia Inicial">Early Career</button></div><div class="expGroup active" data-exp-group="meli"><p class="expCompanySummary" data-en="FP&A leadership across logistics and fulfillment, combining P&L ownership, forecasting, cost optimization, analytics and team leadership." data-es="Liderazgo de FP&A en logística y fulfillment, combinando gestión de P&L, forecast, optimización de costos, analytics y liderazgo de equipo.">FP&A leadership across logistics and fulfillment, combining P&L ownership, forecasting, cost optimization, analytics and team leadership.</p><div class="timelineItem"><div class="year">2023–2026</div><div><h4>Mercado Libre</h4><div class="role" data-en="Financial Supervisor | Logistics FP&A Lead" data-es="Supervisor Financiero | Líder de FP&A Logístico">Financial Supervisor | Logistics FP&A Lead</div><ul class="expBullets"><li data-en="Promoted based on performance to lead FP&A for Middle Mile, Cross-Border Trade and commercial carriers, overseeing USD $44.1M in monthly spend and 4 direct reports." data-es="Promovido por desempeño para liderar FP&A de Middle Mile, Cross-Border Trade y transportistas comerciales, con MXN $750M de gasto mensual y 4 reportes directos.">Promoted based on performance to lead FP&A for Middle Mile, Cross-Border Trade and commercial carriers, overseeing USD $44.1M in monthly spend and 4 direct reports.</li><li data-en="Led budgeting, forecasting, P&L and variance analysis, achieving 95% forecast accuracy." data-es="Lideré presupuesto, forecast, análisis de P&L y variaciones, alcanzando 95% de precisión del forecast.">Led budgeting, forecasting, P&L and variance analysis, achieving 95% forecast accuracy.</li><li data-en="Automated transportation costing and billing analysis with SQL (BigQuery) across 20M–25M monthly shipments, saving 1 workday per week." data-es="Automaticé costeo de transporte y análisis de facturación con SQL (BigQuery) para 20M–25M de envíos mensuales, ahorrando 1 día de trabajo por semana.">Automated transportation costing and billing analysis with SQL (BigQuery) across 20M–25M monthly shipments, saving 1 workday per week.</li><li data-en="Reduced accrual-to-billing variance to <1% and tracked USD $5.9M–$7.4M in monthly transportation savings versus budget." data-es="Reduje la variación provisión-facturación a <1% y monitoreé MXN $100M–$125M de ahorro mensual frente al presupuesto.">Reduced accrual-to-billing variance to &lt;1% and tracked USD $5.9M–$7.4M in monthly transportation savings versus budget.</li><li data-en="Modeled Peak Season scenarios and route/carrier economics; built ROI, NPV and CAPEX business cases for leadership reviews." data-es="Modelé escenarios de Peak Season y economía de rutas/carriers; desarrollé business cases de ROI, VAN y CAPEX para revisiones de liderazgo.">Modeled Peak Season scenarios and route/carrier economics; built ROI, NPV and CAPEX business cases for leadership reviews.</li><li data-en="Led 4 financial analysts; 2 advanced into new roles and the remaining team became autonomous." data-es="Lideré 4 analistas financieros; 2 avanzaron a nuevas posiciones y el resto alcanzó autonomía.">Led 4 financial analysts; 2 advanced into new roles and the remaining team became autonomous.</li></ul></div></div><div class="timelineItem"><div class="year">2021–2023</div><div><h4>Mercado Libre</h4><div class="role" data-en="Senior Financial Analyst | Fulfillment Controller" data-es="Analista Financiero Senior | Controller de Fulfillment">Senior Financial Analyst | Fulfillment Controller</div><ul class="expBullets"><li data-en="Led budgeting, forecasting, P&L analysis and financial planning for Fulfillment operations." data-es="Responsable de presupuesto, forecast, P&L y planeación financiera de Fulfillment.">Led budgeting, forecasting, P&L analysis and financial planning for Fulfillment operations.</li><li data-en="Developed headcount and labor-cost plans based on volume and operational requirements." data-es="Desarrollé planeación de headcount y costos laborales con base en volumen y necesidades operativas.">Developed headcount and labor-cost plans based on volume and operational requirements.</li><li data-en="Partnered with Operations, Engineering, Quality, Maintenance and HR on OPEX, accruals and financial variances." data-es="Finance Business Partner de Operaciones, Ingeniería, Calidad, Mantenimiento y RH en OPEX, provisiones y variaciones.">Partnered with Operations, Engineering, Quality, Maintenance and HR on OPEX, accruals and financial variances.</li><li data-en="Standardized OPEX, budgeting and forecasting processes across Fulfillment Centers in Mexico." data-es="Estandaricé procesos de OPEX, presupuesto y forecast en los centros de fulfillment de México.">Standardized OPEX, budgeting and forecasting processes across Fulfillment Centers in Mexico.</li><li data-en="Led packaging optimization with SQL and Tableau, delivering USD $176K–$294K in recurring monthly savings for 12 months." data-es="Lideré optimización de empaques con SQL y Tableau, generando MXN $3M–$5M de ahorro mensual recurrente durante 12 meses.">Led packaging optimization with SQL and Tableau, delivering USD $176K–$294K in recurring monthly savings for 12 months.</li><li data-en="Scaled packaging analytics across Mexico, Brazil and Argentina and supported CAPEX and warehouse investments." data-es="Escalé analítica de empaques a México, Brasil y Argentina y apoyé CAPEX e inversiones de almacén.">Scaled packaging analytics across Mexico, Brazil and Argentina and supported CAPEX and warehouse investments.</li></ul></div></div></div><div class="expGroup" data-exp-group="fresenius"><p class="expCompanySummary" data-en="Manufacturing finance, controllership, cost accounting and investment management for Fresenius Medical Care North America." data-es="Finanzas de manufactura, contraloría, contabilidad de costos y gestión de inversiones para Fresenius Medical Care North America.">Manufacturing finance, controllership, cost accounting and investment management for Fresenius Medical Care North America.</p><div class="timelineItem"><div class="year">2019–2021</div><div><h4>Fresenius Medical Care North America</h4><div class="role" data-en="Financial Supervisor | Assistant Controller | Cost Accounting & FP&A" data-es="Supervisor Financiero | Assistant Controller | Costos & FP&A">Financial Supervisor | Assistant Controller | Cost Accounting & FP&A</div><ul class="expBullets"><li data-en="Promoted based on performance, expanding responsibilities across cost accounting, FP&A and controllership." data-es="Promovido por desempeño, ampliando responsabilidades en Costos, FP&A y Controllership.">Promoted based on performance, expanding responsibilities across cost accounting, FP&A and controllership.</li><li data-en="Managed budgeting, forecasting, month-end close and full P&L analysis for manufacturing operations." data-es="Responsable de presupuesto, forecast, cierre mensual y P&L de operaciones de manufactura.">Managed budgeting, forecasting, month-end close and full P&L analysis for manufacturing operations.</li><li data-en="Led product costing and BOM analysis and analyzed PPV, material usage, FX and manufacturing variances." data-es="Lideré costeo y análisis de BOM y analicé PPV, consumo de materiales, FX y variaciones de manufactura.">Led product costing and BOM analysis and analyzed PPV, material usage, FX and manufacturing variances.</li><li data-en="Reduced delivery of the complete monthly financial close package from 5 days to 2 days using SAP and Advanced Excel." data-es="Reduje de 5 a 2 días la entrega completa del cierre financiero mensual mediante SAP y Excel Avanzado.">Reduced delivery of the complete monthly financial close package from 5 days to 2 days using SAP and Advanced Excel.</li><li data-en="Built ROI, NPV and IRR models for two new production lines and strategic investments." data-es="Lideré modelos financieros de ROI, VAN y TIR para dos nuevas líneas de producción e inversiones.">Built ROI, NPV and IRR models for two new production lines and strategic investments.</li><li data-en="Supported SOX controls, physical inventories and internal and external audits." data-es="Gestioné controles SOX, inventarios físicos y auditorías internas y externas.">Supported SOX controls, physical inventories and internal and external audits.</li></ul></div></div><div class="timelineItem"><div class="year">2017–2019</div><div><h4>Fresenius Medical Care North America</h4><div class="role" data-en="Senior Financial Analyst | CAPEX & Fixed Assets" data-es="Analista Financiero Senior | CAPEX & Activos Fijos">Senior Financial Analyst | CAPEX & Fixed Assets</div><ul class="expBullets"><li data-en="Managed approximately USD $100M in annual CAPEX, increasing execution from ~50% to ~90%." data-es="Gestioné aproximadamente MXN $1,700M de CAPEX anual, aumentando su ejecución de ~50% a ~90%.">Managed approximately USD $100M in annual CAPEX, increasing execution from ~50% to ~90%.</li><li data-en="Led CAPEX and depreciation budgeting, forecasting and variance analysis." data-es="Lideré presupuesto, forecast y variaciones de CAPEX y depreciación en manufactura.">Led CAPEX and depreciation budgeting, forecasting and variance analysis.</li><li data-en="Managed capitalization, depreciation, transfers, disposals and fixed-asset controls." data-es="Gestioné capitalizaciones, depreciaciones, transferencias, bajas y controles de activos fijos.">Managed capitalization, depreciation, transfers, disposals and fixed-asset controls.</li><li data-en="Automated CAPEX reporting using SAP and Advanced Excel, improving project visibility and control." data-es="Automaticé reportes de CAPEX con SAP y Excel Avanzado, mejorando la visibilidad y control de proyectos.">Automated CAPEX reporting using SAP and Advanced Excel, improving project visibility and control.</li><li data-en="Partnered with Engineering and Quality on investments, OPEX and financial decisions." data-es="Finance Business Partner de Ingeniería y Calidad en inversiones, OPEX y decisiones financieras.">Partnered with Engineering and Quality on investments, OPEX and financial decisions.</li></ul></div></div></div><div class="expGroup" data-exp-group="early"><p class="expCompanySummary" data-en="Foundational experience across U.S. billing, entrepreneurship, customer accounts and audit." data-es="Experiencia inicial en facturación de EE. UU., emprendimiento, cuentas de clientes y auditoría.">Foundational experience across U.S. billing, entrepreneurship, customer accounts and audit.</p><div class="earlyGrid"><article class="earlyRole"><h4 data-en="Billing Analyst | Kelly Services" data-es="Analista de Facturación | Kelly Services">Billing Analyst | Kelly Services</h4><div class="year">2016–2017</div><p data-en="Processed and modified U.S. customer invoices, performing validations, adjustments and reconciliations using PeopleSoft and Mainframe." data-es="Procesé y modifiqué facturas de clientes de Estados Unidos, realizando validaciones, ajustes y conciliaciones con PeopleSoft y Mainframe.">Processed and modified U.S. customer invoices, performing validations, adjustments and reconciliations using PeopleSoft and Mainframe.</p></article><article class="earlyRole"><h4 data-en="Business Owner" data-es="Propietario de Negocio">Business Owner</h4><div class="year">2015–2016</div><p data-en="Founded and managed a water purification and refill business, overseeing operations, customer service and finances." data-es="Fundé y administré un negocio de purificación y rellenado de agua, gestionando operaciones, clientes y finanzas.">Founded and managed a water purification and refill business, overseeing operations, customer service and finances.</p></article><article class="earlyRole"><h4 data-en="Journal Bill Back Analyst | Panduit" data-es="Analista de Facturación y Cuentas | Panduit">Journal Bill Back Analyst | Panduit</h4><div class="year">2014–2015</div><p data-en="Managed billing adjustments and customer accounts across the U.S. and Canada using Oracle." data-es="Gestioné ajustes de facturación y cuentas de clientes de Estados Unidos y Canadá utilizando Oracle.">Managed billing adjustments and customer accounts across the U.S. and Canada using Oracle.</p></article><article class="earlyRole"><h4 data-en="Audit Intern | Deloitte México" data-es="Becario de Auditoría | Deloitte México">Audit Intern | Deloitte México</h4><div class="year">2011–2012</div><p data-en="Supported automotive dealership audits, physical inventory counts and inventory validation, plus audit documentation and client follow-up." data-es="Apoyé auditorías de agencias automotrices, conteos físicos y validación de inventarios, además de documentación y seguimiento con clientes.">Supported automotive dealership audits, physical inventory counts and inventory validation, plus audit documentation and client follow-up.</p></article></div></div></div></section>'''
          s,n=re.subn(r'<section id="experience" class="section">.*?</section><section id="skills"',section+'<section id="skills"',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('Experience section not found')
          js='''<script>(()=>{const buttons=document.querySelectorAll('.expFilter');const groups=document.querySelectorAll('.expGroup');buttons.forEach(btn=>btn.addEventListener('click',()=>{buttons.forEach(b=>b.classList.remove('active'));groups.forEach(g=>g.classList.remove('active'));btn.classList.add('active');document.querySelector('[data-exp-group="'+btn.dataset.exp+'"]')?.classList.add('active')}));})();</script>'''
          s=s.replace('</body>',js+'</body>',1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add interactive company experience filter"
          git push
