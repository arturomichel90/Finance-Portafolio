name: Add finance dashboard filters
on:
  push:
    paths:
      - '.github/workflows/add-finance-filters.yml'
permissions:
  contents: write
jobs:
  update-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add functional dashboard controls
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          bad="<script src=\"https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js\">;(()=>{const targets=document.querySelectorAll('.kpi,.card,.panel,.case,.skill,.timelineItem,.contact');targets.forEach(el=>el.classList.add('reveal'));const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target)}}),{threshold:.12});targets.forEach(el=>io.observe(el));document.querySelectorAll('.case,.panel').forEach(el=>{const t=(el.textContent||'').toLowerCase();if(t.includes('capex')||t.includes('capital expenditure'))el.classList.add('capexAccent')});})();</script>"
          s=s.replace(bad,'<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>',1)

          css='''.dashboardControls{display:flex;align-items:end;gap:10px;flex-wrap:wrap;margin:-8px 0 20px;padding:14px 16px;background:rgba(13,27,42,.72);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(10px)}.controlGroup{display:grid;gap:5px}.controlGroup label{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.09em;text-transform:uppercase}.controlGroup select{appearance:none;min-width:145px;background:#102238;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 34px 10px 11px;font:700 12px Inter;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--mint) 50%),linear-gradient(135deg,var(--mint) 50%,transparent 50%);background-position:calc(100% - 15px) 15px,calc(100% - 10px) 15px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}.controlGroup select:hover,.controlGroup select:focus{border-color:rgba(94,230,181,.5);outline:none}.resetFilters{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer;transition:.2s}.resetFilters:hover{color:var(--text);border-color:rgba(134,184,255,.5)}.filterStatus{margin-left:auto;color:var(--muted);font-size:11px;align-self:center}.filterHidden{display:none!important}.annualMode .canvas{opacity:.32;filter:saturate(.7)}.annualMode .driverGrid{opacity:.72}@media(max-width:600px){.dashboardControls{align-items:stretch}.controlGroup,.controlGroup select{width:100%}.filterStatus{margin-left:0}}'''
          s=s.replace('</style>',css+'</style>',1)

          controls='''<div class="dashboardControls" id="dashboardControls"><div class="controlGroup"><label data-en="Period" data-es="Periodo">Period</label><select id="periodFilter"><option value="monthly" data-en="Monthly" data-es="Mensual">Monthly</option><option value="annual" data-en="Annual" data-es="Anual">Annual</option></select></div><div class="controlGroup"><label data-en="Currency" data-es="Moneda">Currency</label><select id="currencyFilter"><option value="usd">USD</option><option value="mxn">MXN</option></select></div><div class="controlGroup"><label data-en="Project" data-es="Proyecto">Project</label><select id="projectFilter"><option value="all" data-en="All projects" data-es="Todos">All projects</option><option value="transport">Transportation</option><option value="packaging">Packaging</option><option value="capex">CAPEX</option></select></div><button class="resetFilters" id="resetFilters" type="button" data-en="↻ Reset" data-es="↻ Restablecer">↻ Reset</button><div class="filterStatus" data-en="Interactive view • modeled monthly distributions" data-es="Vista interactiva • distribuciones mensuales modeladas">Interactive view • modeled monthly distributions</div></div>'''
          needle='<div class="kpis">'
          if needle not in s:
              raise SystemExit('KPI block not found')
          s=s.replace(needle,controls+needle,1)

          js='''<script>(()=>{function initDashboardUI(){const targets=document.querySelectorAll('.kpi,.card,.panel,.case,.skill,.timelineItem,.contact');targets.forEach(el=>el.classList.add('reveal'));if('IntersectionObserver'in window){const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target)}}),{threshold:.12});targets.forEach(el=>io.observe(el))}else targets.forEach(el=>el.classList.add('visible'));document.querySelectorAll('.case,.panel').forEach(el=>{const t=(el.textContent||'').toLowerCase();if(t.includes('capex')||t.includes('capital expenditure'))el.classList.add('capexAccent')});const period=document.getElementById('periodFilter'),currency=document.getElementById('currencyFilter'),project=document.getElementById('projectFilter'),reset=document.getElementById('resetFilters'),dashboard=document.getElementById('dashboard');if(!period||!currency||!project)return;function setCurrency(cur){if(typeof transportChart==='undefined'||typeof packagingChart==='undefined')return;const mxn=cur==='mxn';transportChart.data.datasets[0].data=mxn?transportMonthlyMXN:transportMonthlyUSD;packagingChart.data.datasets[0].data=mxn?packagingMonthlyMXN:packagingMonthlyUSD;transportChart.options.scales.y.title.text=mxn?((typeof lang!=='undefined'&&lang==='es')?'MXN millones':'MXN millions'):'USD millions';packagingChart.options.scales.y.title.text=mxn?((typeof lang!=='undefined'&&lang==='es')?'MXN miles':'MXN thousands'):'USD thousands';transportChart.update();packagingChart.update()}function setPeriod(v){dashboard?.classList.toggle('annualMode',v==='annual')}function setProject(v){document.querySelectorAll('#dashboard .card,#dashboard .panel').forEach(el=>{const t=(el.textContent||'').toLowerCase();const show=v==='all'||(v==='transport'&&(t.includes('transport')||t.includes('carrier')||t.includes('accrual')))||(v==='packaging'&&t.includes('packag'))||(v==='capex'&&(t.includes('capex')||t.includes('capital expenditure')));el.classList.toggle('filterHidden',!show)})}currency.addEventListener('change',()=>setCurrency(currency.value));period.addEventListener('change',()=>setPeriod(period.value));project.addEventListener('change',()=>setProject(project.value));reset.addEventListener('click',()=>{period.value='monthly';currency.value=(typeof lang!=='undefined'&&lang==='es')?'mxn':'usd';project.value='all';setPeriod('monthly');setCurrency(currency.value);setProject('all')});document.getElementById('langEn')?.addEventListener('click',()=>{currency.value='usd';setTimeout(()=>setCurrency('usd'),0)});document.getElementById('langEs')?.addEventListener('click',()=>{currency.value='mxn';setTimeout(()=>setCurrency('mxn'),0)})}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initDashboardUI);else initDashboardUI()})();</script>'''
          s=s.replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add interactive finance dashboard filters" || exit 0
          git push
